<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Particle Ecosystem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    background: #000;
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
    cursor: crosshair;
  }

  canvas { display: block; }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .state-info {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    pointer-events: none;
  }

  .state-info.active { opacity: 1; }

  .state-info h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #00d4ff, #7b2dff, #ff2d95);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 80px rgba(123, 45, 255, 0.5);
    animation: glowPulse 3s ease-in-out infinite;
  }

  .state-info .subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(0.8rem, 2vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.5em;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 0.5em;
    text-transform: uppercase;
  }

  .state-info .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #7b2dff, transparent);
    margin: 1em auto;
  }

  @keyframes glowPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .state-nav {
    position: fixed;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    z-index: 20;
    pointer-events: all;
  }

  .nav-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
  }

  .nav-dot:hover {
    background: rgba(123, 45, 255, 0.8);
    transform: scale(1.3);
  }

  .nav-dot.active {
    background: #7b2dff;
    box-shadow: 0 0 20px rgba(123, 45, 255, 0.8), 0 0 40px rgba(123, 45, 255, 0.4);
    transform: scale(1.2);
  }

  .nav-dot .label {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease;
    color: rgba(255, 255, 255, 0.8);
  }

  .nav-dot:hover .label,
  .nav-dot.active .label { opacity: 1; }

  .stats-bar {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.4);
    z-index: 20;
  }

  .stat-item span {
    color: rgba(0, 212, 255, 0.8);
    font-weight: 700;
  }

  .corner-frame {
    position: fixed;
    width: 60px; height: 60px;
    z-index: 15;
  }

  .corner-frame.tl { top: 1.5rem; left: 1.5rem; border-top: 1px solid rgba(123, 45, 255, 0.4); border-left: 1px solid rgba(123, 45, 255, 0.4); }
  .corner-frame.tr { top: 1.5rem; right: 1.5rem; border-top: 1px solid rgba(123, 45, 255, 0.4); border-right: 1px solid rgba(123, 45, 255, 0.4); }
  .corner-frame.bl { bottom: 1.5rem; left: 1.5rem; border-bottom: 1px solid rgba(123, 45, 255, 0.4); border-left: 1px solid rgba(123, 45, 255, 0.4); }
  .corner-frame.br { bottom: 1.5rem; right: 1.5rem; border-bottom: 1px solid rgba(123, 45, 255, 0.4); border-right: 1px solid rgba(123, 45, 255, 0.4); }
</style>
</head>
<body>

<div id="ui-overlay">
  <div class="corner-frame tl"></div>
  <div class="corner-frame tr"></div>
  <div class="corner-frame bl"></div>
  <div class="corner-frame br"></div>

  <div class="state-info" id="state-0">
    <h1>COSMOS</h1>
    <div class="divider"></div>
    <div class="subtitle">Galactic Ring Formation</div>
  </div>
  <div class="state-info" id="state-1">
    <h1>WEB3</h1>
    <div class="divider"></div>
    <div class="subtitle">Decentralized Data Matrix</div>
  </div>
  <div class="state-info" id="state-2">
    <h1>BIOLOGY</h1>
    <div class="divider"></div>
    <div class="subtitle">DNA Double Helix Structure</div>
  </div>
</div>

<nav class="state-nav">
  <div class="nav-dot active" data-state="0"><span class="label">COSMOS</span></div>
  <div class="nav-dot" data-state="1"><span class="label">WEB3</span></div>
  <div class="nav-dot" data-state="2"><span class="label">BIOLOGY</span></div>
</nav>

<div class="stats-bar">
  <div class="stat-item">PARTICLES: <span>65536</span></div>
  <div class="stat-item">STATE: <span id="stat-state">RING</span></div>
  <div class="stat-item">FPS: <span id="stat-fps">60</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
// ============================================================
// SIMPLEX NOISE GLSL IMPLEMENTATION
// Embedded directly to ensure shader has access to noise functions
// ============================================================
const SIMPLEX_NOISE_GLSL = `
//
// Description : Array and textureless GLSL 2D/3D/4D simplex noise.
//               Ian McEwan, Ashima Arts.
//
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

// ============================================================
// VERTEX SHADER
// Implements simplex noise for organic fluid wave motion
// Supports morphing between 3 states via u_progress
// ============================================================
const vertexShader = `
${SIMPLEX_NOISE_GLSL}

uniform float u_time;
uniform float u_progress;
uniform float u_morphSpeed;
uniform float u_noiseIntensity;

attribute vec3 a_targetPosition;
attribute float a_randomSeed;

varying float v_noise;
varying float v_depth;
varying float v_randomSeed;
varying vec3 v_position;

void main() {
  float t = u_progress;
  
  // LERP between current and target position based on u_progress
  vec3 pos = mix(position, a_targetPosition, t);
  
  // Multi-octave simplex noise for organic fluid motion
  float speed = u_time * 0.15;
  
  // Primary noise wave - large scale undulation
  float noise1 = snoise(vec3(pos.x * 0.3 + speed, pos.y * 0.3, pos.z * 0.3 + speed * 0.7));
  
  // Secondary noise - medium detail turbulence
  float noise2 = snoise(vec3(pos.x * 0.8 - speed * 1.3, pos.y * 0.8 + speed * 0.5, pos.z * 0.8)) * 0.5;
  
  // Tertiary noise - fine detail shimmer
  float noise3 = snoise(vec3(pos.x * 2.0 + speed * 2.0, pos.y * 2.0 - speed, pos.z * 2.0 + speed * 1.5)) * 0.25;
  
  // Combined noise displacement
  float combinedNoise = noise1 + noise2 + noise3;
  v_noise = combinedNoise;
  
  // Apply noise as displacement along multiple axes for fluid motion
  vec3 displacement = vec3(
    combinedNoise * u_noiseIntensity * 0.6,
    snoise(vec3(pos.x * 0.5, pos.y * 0.5 + speed, pos.z * 0.5)) * u_noiseIntensity * 0.8,
    combinedNoise * u_noiseIntensity * 0.4
  );
  
  pos += displacement;
  v_position = pos;
  v_randomSeed = a_randomSeed;
  
  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
  v_depth = -mvPosition.z;
  
  // Attenuate point size based on depth
  gl_PointSize = (300.0 / -mvPosition.z) * (1.0 + 0.3 * combinedNoise);
  gl_PointSize = clamp(gl_PointSize, 1.0, 8.0);
  
  gl_Position = projectionMatrix * mvPosition;
}
`;

// ============================================================
// FRAGMENT SHADER
// Creates soft glowing particles with neon color palette
// ============================================================
const fragmentShader = `
uniform float u_time;
uniform vec3 u_color1;  // Neon blue
uniform vec3 u_color2;  // Deep purple
uniform vec3 u_color3;  // Vibrant magenta
uniform float u_opacity;

varying float v_noise;
varying float v_depth;
varying float v_randomSeed;
varying vec3 v_position;

void main() {
  // Soft circular particle with distance-from-center falloff
  vec2 center = gl_PointCoord - 0.5;
  float dist = length(center);
  
  // Smooth soft circle with glow
  float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
  alpha *= alpha; // Sharper falloff for glow effect
  
  // Color interpolation based on noise and position
  float colorMix1 = sin(v_noise * 2.0 + u_time * 0.3 + v_randomSeed * 6.28) * 0.5 + 0.5;
  float colorMix2 = cos(v_position.y * 0.5 + u_time * 0.2) * 0.5 + 0.5;
  
  // Blend the three neon colors
  vec3 color = mix(u_color1, u_color2, colorMix1);
  color = mix(color, u_color3, colorMix2 * 0.6);
  
  // Add brightness variation based on noise
  float brightness = 0.7 + v_noise * 0.3;
  color *= brightness;
  
  // Depth-based fade for atmospheric perspective
  float depthFade = clamp(1.0 - v_depth * 0.008, 0.3, 1.0);
  
  // Final alpha with depth fade
  float finalAlpha = alpha * u_opacity * depthFade;
  
  // Discard transparent pixels
  if (finalAlpha < 0.01) discard;
  
  gl_FragColor = vec4(color, finalAlpha);
}
`;

// ============================================================
// MAIN APPLICATION CLASS
// ============================================================
class CosmicParticleSystem {
  constructor() {
    // Configuration
    this.PARTICLE_COUNT = 65536; // 256^2 for optimal performance
    this.currentState = 0;
    this.targetState = 0;
    this.isTransitioning = false;
    
    // Color palette: neon blue, deep purple, vibrant magenta
    this.COLORS = {
      neonBlue: new THREE.Color(0x00d4ff),
      deepPurple: new THREE.Color(0x7b2dff),
      vibrantMagenta: new THREE.Color(0xff2d95)
    };
    
    // Camera positions for each state
    this.cameraStates = [
      { pos: [0, 8, 25], lookAt: [0, 0, 0] },    // Ring - slightly elevated
      { pos: [0, 5, 30], lookAt: [0, 0, 0] },     // Grid - straight on
      { pos: [15, 5, 20], lookAt: [0, 0, 0] }      // Helix - angled view
    ];
    
    // State labels for the stats bar
    this.stateLabels = ['RING', 'MATRIX', 'HELIX'];
    
    // Performance tracking
    this.frameCount = 0;
    this.lastFPSTime = performance.now();
    this.currentFPS = 60;
    
    this.init();
    this.createParticleStates();
    this.createParticleSystem();
    this.setupUI();
    this.animate();
  }
  
  // ============================================================
  // INITIALIZATION
  // ============================================================
  init() {
    // Scene setup
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x000000, 0.015);
    
    // Camera setup
    this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(...this.cameraStates[0].pos);
    this.camera.lookAt(new THREE.Vector3(...this.cameraStates[0].lookAt));
    
    // Renderer setup
    this.renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setClearColor(0x000000, 1);
    document.body.appendChild(this.renderer.domElement);
    
    // Clock for time uniform
    this.clock = new THREE.Clock();
    
    // Mouse tracking for subtle parallax
    this.mouse = { x: 0, y: 0 };
    this.targetMouse = { x: 0, y: 0 };
    
    // Event listeners
    window.addEventListener('resize', () => this.onResize());
    window.addEventListener('mousemove', (e) => {
      this.targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      this.targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });
  }
  
  // ============================================================
  // PARTICLE STATE GENERATION
  // Creates position arrays for each morphing state
  // ============================================================
  createParticleStates() {
    this.states = {
      positions0: new Float32Array(this.PARTICLE_COUNT * 3), // Cosmic ring
      positions1: new Float32Array(this.PARTICLE_COUNT * 3), // Data grid
      positions2: new Float32Array(this.PARTICLE_COUNT * 3), // DNA helix
    };
    
    this.generateRingState();
    this.generateGridState();
    this.generateHelixState();
  }
  
  // State 0: Flat rotating cosmic ring (galaxy shape)
  generateRingState() {
    const positions = this.states.positions0;
    const sqrtCount = Math.sqrt(this.PARTICLE_COUNT);
    
    for (let i = 0; i < this.PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      
      // Galaxy spiral arm distribution
      const arm = (i % 3) * (Math.PI * 2 / 3); // 3 spiral arms
      const distance = Math.pow(Math.random(), 0.5) * 12; // Square root for uniform disk distribution
      const spiralAngle = distance * 0.4 + arm; // Spiral twist
      const jitter = (Math.random() - 0.5) * 2.5; // Random spread
      
      // Add some vertical spread for cosmic dust
      const verticalSpread = (Math.random() - 0.5) * 1.5 * Math.exp(-distance * 0.15);
      
      positions[i3] = Math.cos(spiralAngle) * distance + jitter * Math.sin(spiralAngle * 2);
      positions[i3 + 1] = verticalSpread;
      positions[i3 + 2] = Math.sin(spiralAngle) * distance + jitter * Math.cos(spiralAngle * 2);
    }
  }
  
  // State 1: 3D bounding box / grid array (data matrix representation)
  generateGridState() {
    const positions = this.states.positions1;
    const gridSize = Math.ceil(Math.cbrt(this.PARTICLE_COUNT));
    const spacing = 1.2;
    const offset = (gridSize - 1) * spacing * 0.5;
    
    let index = 0;
    for (let x = 0; x < gridSize && index < this.PARTICLE_COUNT; x++) {
      for (let y = 0; y < gridSize && index < this.PARTICLE_COUNT; y++) {
        for (let z = 0; z < gridSize && index < this.PARTICLE_COUNT; z++) {
          if (index >= this.PARTICLE_COUNT) break;
          
          const i3 = index * 3;
          
          // Create regular grid with slight random perturbation
          const perturbation = 0.15;
          positions[i3] = (x * spacing - offset) + (Math.random() - 0.5) * perturbation;
          positions[i3 + 1] = (y * spacing - offset) + (Math.random() - 0.5) * perturbation;
          positions[i3 + 2] = (z * spacing - offset) + (Math.random() - 0.5) * perturbation;
          
          index++;
        }
      }
    }
    
    // Fill remaining with scattered particles around the grid
    for (let i = index; i < this.PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      positions[i3] = (Math.random() - 0.5) * gridSize * spacing;
      positions[i3 + 1] = (Math.random() - 0.5) * gridSize * spacing;
      positions[i3 + 2] = (Math.random() - 0.5) * gridSize * spacing;
    }
  }
  
  // State 2: DNA double-helix structure
  generateHelixState() {
    const positions = this.states.positions2;
    const helixHeight = 20;
    const helixRadius = 4;
    const particlesPerStrand = Math.floor(this.PARTICLE_COUNT / 2);
    
    for (let i = 0; i < this.PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const strand = i < particlesPerStrand ? 0 : 1;
      const localIndex = i < particlesPerStrand ? i : i - particlesPerStrand;
      const t = localIndex / particlesPerStrand;
      
      // Helix angle
      const angle = t * Math.PI * 8 + strand * Math.PI; // Phase offset for second strand
      const y = (t - 0.5) * helixHeight;
      
      // Base helix position
      const radius = helixRadius + (Math.random() - 0.5) * 0.3;
      
      // Cross-links between strands (base pairs)
      const isBasePair = Math.random() < 0.15;
      let x, z;
      
      if (isBasePair) {
        // Interpolate between the two strands for base pair connections
        const bpT = Math.random();
        const angle1 = angle;
        const angle2 = angle + Math.PI;
        const midAngle = angle1 + (angle2 - angle1) * bpT;
        x = Math.cos(midAngle) * radius * bpT;
        z = Math.sin(midAngle) * radius * bpT;
      } else {
        x = Math.cos(angle) * radius;
        z = Math.sin(angle) * radius;
      }
      
      positions[i3] = x;
      positions[i3 + 1] = y;
      positions[i3 + 2] = z;
    }
  }
  
  // ============================================================
  // PARTICLE SYSTEM CREATION
  // Sets up geometry, attributes, and shader material
  // ============================================================
  createParticleSystem() {
    const geometry = new THREE.BufferGeometry();
    
    // Initial positions (start from ring state)
    geometry.setAttribute('position', new THREE.BufferAttribute(this.states.positions0.slice(), 3));
    
    // Target positions for morphing (initially same as current)
    geometry.setAttribute('a_targetPosition', new THREE.BufferAttribute(this.states.positions0.slice(), 3));
    
    // Random seed per particle for varied effects
    const randomSeeds = new Float32Array(this.PARTICLE_COUNT);
    for (let i = 0; i < this.PARTICLE_COUNT; i++) {
      randomSeeds[i] = Math.random();
    }
    geometry.setAttribute('a_randomSeed', new THREE.BufferAttribute(randomSeeds, 1));
    
    // Shader material with uniforms
    this.material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: {
        u_time: { value: 0 },
        u_progress: { value: 0 },
        u_morphSpeed: { value: 1.0 },
        u_noiseIntensity: { value: 1.0 },
        u_color1: { value: this.COLORS.neonBlue },
        u_color2: { value: this.COLORS.deepPurple },
        u_color3: { value: this.COLORS.vibrantMagenta },
        u_opacity: { value: 1.0 }
      },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true
    });
    
    this.particles = new THREE.Points(geometry, this.material);
    this.scene.add(this.particles);
    
    // Add subtle ambient background particles
    this.createBackgroundParticles();
  }
  
  // Background ambient particles for depth
  createBackgroundParticles() {
    const count = 5000;
    const positions = new Float32Array(count * 3);
    
    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      positions[i3] = (Math.random() - 0.5) * 100;
      positions[i3 + 1] = (Math.random() - 0.5) * 100;
      positions[i3 + 2] = (Math.random() - 0.5) * 100;
    }
    
    const bgGeometry = new THREE.BufferGeometry();
    bgGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const bgMaterial = new THREE.PointsMaterial({
      size: 0.08,
      color: 0x4444ff,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    
    this.bgParticles = new THREE.Points(bgGeometry, bgMaterial);
    this.scene.add(this.bgParticles);
  }
  
  // ============================================================
  // STATE TRANSITIONS
  // Smoothly interpolates particle positions between states
  // ============================================================
  transitionToState(stateIndex) {
    if (this.isTransitioning || stateIndex === this.currentState) return;
    
    this.isTransitioning = true;
    this.targetState = stateIndex;
    
    // Get target positions
    const targetPositions = this.states[`positions${stateIndex}`];
    
    // Set target positions in geometry
    const geo = this.particles.geometry;
    geo.attributes.a_targetPosition.array.set(targetPositions);
    geo.attributes.a_targetPosition.needsUpdate = true;
    
    // Store current positions as the start
    const currentPositions = geo.attributes.position.array;
    
    // Reset progress
    this.material.uniforms.u_progress.value = 0;
    
    // Animate progress using GSAP for smooth easing
    gsap.to(this.material.uniforms.u_progress, {
      value: 1,
      duration: 2.0,
      ease: 'power2.inOut',
      onComplete: () => {
        // Copy target positions to current positions
        currentPositions.set(targetPositions);
        geo.attributes.position.needsUpdate = true;
        this.material.uniforms.u_progress.value = 0;
        
        // Update current state reference
        this.currentState = stateIndex;
        this.isTransitioning = false;
      }
    });
    
    // Animate camera to new position
    this.animateCamera(stateIndex);
    
    // Update UI
    this.updateUI(stateIndex);
  }
  
  // ============================================================
  // CAMERA ANIMATION
  // Cinematic camera movement between states
  // ============================================================
  animateCamera(stateIndex) {
    const camState = this.cameraStates[stateIndex];
    const targetPos = new THREE.Vector3(...camState.pos);
    const targetLookAt = new THREE.Vector3(...camState.lookAt);
    
    // Animate camera position
    gsap.to(this.camera.position, {
      x: targetPos.x,
      y: targetPos.y,
      z: targetPos.z,
      duration: 2.5,
      ease: 'power3.inOut',
      onUpdate: () => {
        this.camera.lookAt(targetLookAt);
      }
    });
  }
  
  // ============================================================
  // UI MANAGEMENT
  // ============================================================
  setupUI() {
    // Navigation dots
    const dots = document.querySelectorAll('.nav-dot');
    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const state = parseInt(dot.dataset.state);
        this.transitionToState(state);
      });
    });
    
    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        const next = (this.currentState + 1) % 3;
        this.transitionToState(next);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        const prev = (this.currentState + 2) % 3;
        this.transitionToState(prev);
      }
    });
    
    // Initial state display
    this.updateUI(0);
  }
  
  updateUI(stateIndex) {
    // Update state info panels
    document.querySelectorAll('.state-info').forEach((el, i) => {
      el.classList.toggle('active', i === stateIndex);
    });
    
    // Update nav dots
    document.querySelectorAll('.nav-dot').forEach((el, i) => {
      el.classList.toggle('active', i === stateIndex);
    });
    
    // Update stats
    document.getElementById('stat-state').textContent = this.stateLabels[stateIndex];
  }
  
  // ============================================================
  // RESIZE HANDLER
  // ============================================================
  onResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }
  
  // ============================================================
  // ANIMATION LOOP
  // ============================================================
  animate() {
    requestAnimationFrame(() => this.animate());
    
    const elapsed = this.clock.getElapsedTime();
    const delta = this.clock.getDelta();
    
    // Update shader uniforms
    this.material.uniforms.u_time.value = elapsed;
    
    // Smooth mouse following for parallax
    this.mouse.x += (this.targetMouse.x - this.mouse.x) * 0.05;
    this.mouse.y += (this.targetMouse.y - this.mouse.y) * 0.05;
    
    // Subtle camera parallax based on mouse
    if (!this.isTransitioning) {
      const camState = this.cameraStates[this.currentState];
      this.camera.position.x = camState.pos[0] + this.mouse.x * 1.5;
      this.camera.position.y = camState.pos[1] + this.mouse.y * 1.0;
      this.camera.lookAt(new THREE.Vector3(...camState.lookAt));
    }
    
    // Slow rotation for the main particle system
    this.particles.rotation.y += 0.001;
    
    // Background particles rotation
    if (this.bgParticles) {
      this.bgParticles.rotation.y += 0.0002;
      this.bgParticles.rotation.x += 0.0001;
    }
    
    // Render
    this.renderer.render(this.scene, this.camera);
    
    // FPS counter
    this.frameCount++;
    const now = performance.now();
    if (now - this.lastFPSTime >= 1000) {
      this.currentFPS = this.frameCount;
      this.frameCount = 0;
      this.lastFPSTime = now;
      document.getElementById('stat-fps').textContent = this.currentFPS;
    }
  }
}

// ============================================================
// INITIALIZE APPLICATION
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const app = new CosmicParticleSystem();
  
  // Expose transitionToState globally for console/UI access
  window.transitionToState = (index) => app.transitionToState(index);
  
  // Auto-rotate through states for demo
  let autoRotateTimer = setInterval(() => {
    if (!app.isTransitioning) {
      const nextState = (app.currentState + 1) % 3;
      app.transitionToState(nextState);
    }
  }, 8000);
  
  // Stop auto-rotate on any user interaction
  const stopAutoRotate = () => {
    clearInterval(autoRotateTimer);
    document.removeEventListener('click', stopAutoRotate);
    document.removeEventListener('keydown', stopAutoRotate);
  };
  document.addEventListener('click', stopAutoRotate);
  document.addEventListener('keydown', stopAutoRotate);
});
</script>
